<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问验证 - AI 智能助手</title>
<link rel="stylesheet" href="style.css">
<style>
  .gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11, 14, 23, 0.9); backdrop-filter: blur(20px);
  }
  .gate-card {
    width: min(360px, 90vw);
    padding: 40px 32px; border-radius: 24px; text-align: center;
    background: rgba(20, 24, 38, 0.9);
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .gate-logo {
    width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 18px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
    box-shadow: 0 8px 24px rgba(108, 140, 255, .45);
  }
  .gate-card h2 { font-size: 18px; margin-bottom: 6px; }
  .gate-card p { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }
  .gate-input {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(255,255,255,.06);
    color: var(--text); font-size: 15px; text-align: center;
    letter-spacing: 4px; outline: none; margin-bottom: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .gate-input:focus { border-color: rgba(108,140,255,.6); box-shadow: 0 0 0 3px rgba(108,140,255,.15); }
  .gate-input::placeholder { letter-spacing: 2px; color: var(--text-dim); }
  .gate-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent-grad); color: #fff; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: filter .2s, transform .1s;
  }
  .gate-btn:hover { filter: brightness(1.15); }
  .gate-btn:active { transform: scale(.98); }
  .gate-error { font-size: 13px; color: #ff6b6b; min-height: 18px; margin-top: 10px; }
  body.locked > *:not(.gate) { display: none !important; }
</style>
</head>
<body class="locked">
  <!-- 密码门禁 -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-logo">AI</div>
      <h2>AI 智能助手</h2>
      <p>请输入访问密码</p>
      <input type="password" class="gate-input" id="pwd" placeholder="访问密码" autocomplete="off">
      <button class="gate-btn" id="enterBtn">进入</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <!-- 背景光斑 -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- 移动端遮罩：点击关闭侧边栏 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">AI</div>
          <div class="logo-text">AI 智能助手</div>
        </div>
        <button class="btn-new-chat" id="newChatBtn">＋ 新对话</button>
      </div>
      <div class="chat-list" id="chatList"></div>
      <div class="sidebar-footer">
        <div class="model-badge">
          <span class="dot"></span>
          <span id="modelName">DeepSeek-V4-Flash</span>
        </div>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleSidebarBtn" title="收起/展开侧边栏">☰</button>
        <div class="topbar-title" id="chatTitle">新对话</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="clearBtn" title="清空当前对话">🗑</button>
        </div>
      </header>

      <div class="chat-window" id="chatWindow">
        <!-- 欢迎屏 -->
        <div class="welcome" id="welcome">
          <div class="welcome-logo">AI</div>
          <h1>你好，我是AI助手小龚</h1>
          <p>基于 DeepSeek-V4-Flash 模型，有什么可以帮你的？</p>
          <div class="suggest-grid">
            <button class="suggest-card" data-q="用通俗的语言解释一下什么是量子计算">
              <span class="suggest-icon">🧠</span>
              <span class="suggest-title">解释概念</span>
              <span class="suggest-desc">用通俗的语言解释什么是量子计算</span>
            </button>
            <button class="suggest-card" data-q="帮我写一首关于秋天的短诗">
              <span class="suggest-icon">✍️</span>
              <span class="suggest-title">创作文本</span>
              <span class="suggest-desc">帮我写一首关于秋天的短诗</span>
            </button>
            <button class="suggest-card" data-q="帮我写一个 Python 函数，判断一个字符串是否是回文">
              <span class="suggest-icon">💻</span>
              <span class="suggest-title">写代码</span>
              <span class="suggest-desc">写一个判断回文字符串的 Python 函数</span>
            </button>
            <button class="suggest-card" data-q="给我推荐几本提升思维能力的书，并说明推荐理由">
              <span class="suggest-icon">📚</span>
              <span class="suggest-title">推荐书单</span>
              <span class="suggest-desc">推荐几本提升思维能力的书</span>
            </button>
          </div>
        </div>
        <!-- 消息列表 -->
        <div class="messages" id="messages"></div>
      </div>

      <footer class="input-bar">
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="输入你的问题… (Enter 发送 / Shift+Enter 换行)"></textarea>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div class="disclaimer">内容由 AI 生成，请注意甄别</div>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
